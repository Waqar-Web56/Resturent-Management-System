<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1b33;--navy2:#1a2a4a;--or:#f26a1b;--ink:#1c2433;--mut:#6b7487;--line:#e6e9ef;--bg:#f5f6f9;--ok:#1a9d63;--bad:#d64545}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px Figtree,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
aside{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:#c9d2e6;display:flex;flex-direction:column;z-index:20;transition:transform .2s}
.logo{padding:20px;font-weight:700;font-size:19px;color:#fff;border-bottom:1px solid var(--navy2)}.logo b{color:var(--or)}
nav{scrollbar-width:thin;scrollbar-color:#2b3d63 transparent;overflow:auto;flex:1;padding:8px}nav::-webkit-scrollbar{width:8px}nav::-webkit-scrollbar-thumb{background:#2b3d63;border-radius:8px}nav::-webkit-scrollbar-track{background:transparent}nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:inherit;text-decoration:none;cursor:pointer}
nav a:hover{background:var(--navy2)}nav a.on{background:var(--or);color:#fff}nav i{width:20px;text-align:center;font-style:normal}
header{position:sticky;top:0;margin-left:248px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:12px 24px;z-index:10}
header h1{font-size:20px;margin:0;flex:1}#gs{width:240px;max-width:35vw}main{margin-left:248px;padding:24px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 3px #0f1b3314;padding:18px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}.grid .card{margin:0}.k{color:var(--mut);font-size:13px}.v{font-size:24px;font-weight:700;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.sp{flex:1}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}.row input,.row select{width:auto}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{font:inherit;font-weight:600;background:var(--or);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}.btn:hover{filter:brightness(.93)}.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:13px}.btn.bad{background:var(--bad)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:13px}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#eef1f6}.tag.g{background:#dff5ea;color:var(--ok)}.tag.o{background:#ffe9db;color:#c2500e}.tag.r{background:#fde4e4;color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:36px}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:99}.toast.bad{background:var(--bad)}
dialog{border:0;border-radius:16px;padding:22px;width:min(560px,94vw);max-height:90vh}dialog::backdrop{background:#0f1b3380}dialog h3{margin:0 0 6px}.line{margin:6px 0}.line select{flex:2}.line input{flex:1;min-width:70px}
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.kds .card{margin:0;border-top:4px solid var(--or)}.kds .late{border-top-color:var(--bad)}
#login{min-height:100vh;display:grid;place-items:center;background:var(--navy)}#login form{background:#fff;padding:30px;border-radius:16px;width:min(380px,92vw)}
#menu{display:none;background:none;border:0;font-size:22px;cursor:pointer}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.open{transform:none}header,main{margin-left:0}#menu{display:block}header{padding:12px 14px}main{padding:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login" hidden><form id="lf"><h2 style="margin:0 0 4px">Restaurant Manager</h2><div class="k">Sign in with your staff account</div>
<label>Email</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password">
<p><button class="btn" style="width:100%">Sign in</button></p></form></div>
<div id="app" hidden><aside id="sb"><div class="logo" id="logo"></div><nav id="nav"></nav></aside>
<header><button id="menu" aria-label="Menu">☰</button><h1 id="title"></h1><input id="gs" placeholder="Search this page" type="search"><button class="btn ghost" id="bell" aria-label="Notifications">🔔 <span id="bc">0</span></button><span id="who" class="k"></span></header>
<main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="app.js"></script></body></html>
